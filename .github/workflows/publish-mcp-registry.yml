name: Publish to MCP Registry

# Publishes every mcp/*/server.json to the official MCP Registry under the
# io.github.jrhite namespace, using GitHub OIDC (no stored secrets).
# Run it by hand after changing a server.json (bump its "version" first:
# the registry refuses to republish an existing version).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish each server.json
        run: |
          set -euo pipefail
          for f in mcp/*/server.json; do
            name=$(jq -r .name "$f"); version=$(jq -r .version "$f")
            if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${name#*/}&limit=50" \
                 | jq -e --arg n "$name" --arg v "$version" '.servers[] | select(.server.name==$n and .server.version==$v)' >/dev/null; then
              echo "$name $version already published, skipped"
              continue
            fi
            echo "Publishing $name $version"
            ./mcp-publisher publish "$f"
          done
